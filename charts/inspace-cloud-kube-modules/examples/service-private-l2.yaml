apiVersion: v1
kind: Service
metadata:
  name: example-private
  labels:
    app.kubernetes.io/name: example-private
    inspace.cloud/load-balancer-scope: private
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  # Local is also supported with Cilium 1.20.2 or later: only nodes with a
  # ready local endpoint then compete for the L2 announcement lease.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: example-private
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
