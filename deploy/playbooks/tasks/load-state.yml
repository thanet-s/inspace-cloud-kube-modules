---
- name: Inspect the deployment state journal
  ansible.builtin.stat:
    path: "{{ deploy_state_dir }}/state.json"
  register: deploy_state_file

- name: Require the deployment state journal
  ansible.builtin.assert:
    that: deploy_state_file.stat.exists and deploy_state_file.stat.isreg
    fail_msg: "No deployment journal exists for this cluster; run deploy/run.sh init first."

- name: Load the deployment state journal
  ansible.builtin.set_fact:
    deployment_state: "{{ lookup('file', deploy_state_dir + '/state.json') | from_json }}"
    persisted_inspace_cluster: "{{ lookup('file', deploy_state_dir + '/cluster.yaml') | from_yaml }}"

# cluster.yaml stays the init-time bootstrap/destroy authority, so its RKE2
# version never moves. The journal's rke2Version records the release `update`
# last rolled onto every control-plane server; older journals omit it.
- name: Resolve the recorded control-plane RKE2 version
  ansible.builtin.set_fact:
    deploy_recorded_rke2_version: "{{ deployment_state.get('rke2Version', persisted_inspace_cluster.spec.rke2.version) }}"

# status, tunnel, and destroy never change the RKE2 version, so after an
# interrupted or partial update they must still work with the inventory already
# on the GA release. That is tolerated only for the exact release the recorded
# candidate became: a released candidate and its own GA (v1.36.5-rc2+rke2r1 and
# v1.36.5+rke2r1). Any other mismatch still means another cluster.
- name: Detect an inventory on the GA release of the recorded release candidate
  ansible.builtin.set_fact:
    deploy_inventory_is_ga_of_recorded_candidate: >-
      {{
        deploy_recorded_rke2_version in deploy_released_rke2_prereleases and
        (deploy_recorded_rke2_version | regex_replace('-rc[0-9]+[+]', '+')) == rke2_version
      }}

- name: Bind local state to the selected inventory
  ansible.builtin.assert:
    that:
      - deployment_state.schema == 'inspace-deploy-state-v1'
      - deployment_state.clusterName == cluster_name
      - deployment_state.controlPlaneReplicas | int == control_plane_replicas | int
      - deployment_state.controlPlanes | length == control_plane_replicas | int
      - deployment_state.sshUsername == ssh_username
      - deployment_state.owner is match('^[0-9a-f]{16}$')
      - deployment_state.bootstrapControllerVersion is match('^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$')
      - persisted_inspace_cluster.metadata.name == cluster_name
      - persisted_inspace_cluster.spec.location == inspace_location
      - persisted_inspace_cluster.spec.billingAccountID | int == inspace_billing_account_id | int
      - persisted_inspace_cluster.spec.network.uuid == inspace_network_uuid
      - persisted_inspace_cluster.spec.endpoint.virtualIPv4 == control_plane_vip
      - persisted_inspace_cluster.spec.network.podCIDR == pod_cidr
      - persisted_inspace_cluster.spec.network.serviceCIDR == service_cidr
      - persisted_inspace_cluster.spec.network.privateLoadBalancerPool.start == private_load_balancer_pool_start
      - persisted_inspace_cluster.spec.network.privateLoadBalancerPool.stop == private_load_balancer_pool_stop
      - persisted_inspace_cluster.spec.controlPlane.replicas | int == control_plane_replicas | int
      - persisted_inspace_cluster.spec.controlPlane.machine.rootDiskGiB | int == control_plane_root_disk_gib | int
      - persisted_inspace_cluster.spec.controlPlane.machine.hostPoolUUID == inspace_amd_host_pool_uuid
      - >-
        deploy_recorded_rke2_version == rke2_version or
        (deploy_allow_rke2_version_change | default(false) | bool) or
        (deploy_inventory_is_ga_of_recorded_candidate | bool)
      - persisted_inspace_cluster.spec.rke2.get('skipOSUpgrade', false) | bool == skip_os_upgrade | bool
      - persisted_inspace_cluster.spec.bootstrapCache.get('directDownload', false) | bool == bootstrap_direct_download | bool
      - >-
        persisted_inspace_cluster.spec.network.get('gatewayAPI', {}).get('enabled', false) | bool ==
        gateway_api_enabled | default(false) | bool
      - >-
        ('rke2-traefik-crd' in persisted_inspace_cluster.spec.rke2.get('disable', [])) ==
        ((gateway_api_enabled | default(false) | bool) or not (rke2_traefik_crd_enabled | default(true) | bool))
    fail_msg: "The deployment journal belongs to another cluster or topology."

# cluster.yaml keeps the init-time machine size, which every control-plane
# ownership hash derives from, so it is never rewritten. The journal's
# controlPlaneMachine records the size `update` last grew the VMs to; older
# journals omit it and fall back to cluster.yaml. An inventory that equals the
# recorded size changes nothing, a larger one asks update for a rolling resize,
# and a smaller one is refused by update. The helper also resumes a journaled
# resize.
- name: Compare the inventory control-plane size with the recorded size
  ansible.builtin.command:
    argv:
      - python3
      - "{{ deploy_root }}/scripts/control_plane_resize.py"
      - classify
      - --mode
      - "{{ 'enforce' if (deploy_enforce_control_plane_size | default(false) | bool) else 'report' }}"
      - --state
      - "{{ deploy_state_dir }}/state.json"
      - --spec-vcpu
      - "{{ persisted_inspace_cluster.spec.controlPlane.machine.vcpu | int }}"
      - --spec-memory-mib
      - "{{ persisted_inspace_cluster.spec.controlPlane.machine.memoryMiB | int }}"
      - --inventory-vcpu
      - "{{ control_plane_vcpu | int }}"
      - --inventory-memory-mib
      - "{{ control_plane_memory_mib | int }}"
  register: deploy_control_plane_size
  changed_when: false

- name: Record whether the control planes must be resized
  ansible.builtin.set_fact:
    control_plane_resize: "{{ deploy_control_plane_size.stdout | from_json }}"
    control_plane_resize_needed: "{{ (deploy_control_plane_size.stdout | from_json).resizeNeeded }}"

# Only update (deploy_enforce_control_plane_size) refuses an inventory size
# that shrinks the control planes; status, tunnel and destroy just report it.
- name: Warn that the inventory control-plane size is not the recorded one
  ansible.builtin.debug:
    msg: "{{ control_plane_resize.error }}"
  when: control_plane_resize.error | length > 0

# These settings live in the immutable control-plane cloud-init and the on-disk
# rke2-cilium HelmChartConfig; update never rewrites either.
- name: Require the creation-time Cilium load-balancer settings
  ansible.builtin.assert:
    that:
      - persisted_inspace_cluster.spec.network.get('loadBalancerAlgorithm', '') == deploy_load_balancer_algorithm
      - persisted_inspace_cluster.spec.network.get('serviceTopology', false) | bool == deploy_service_topology | bool
    fail_msg: >-
      load_balancer_algorithm and service_topology are fixed at cluster creation
      (this cluster: load_balancer_algorithm
      "{{ persisted_inspace_cluster.spec.network.get('loadBalancerAlgorithm', '') }}",
      service_topology {{ persisted_inspace_cluster.spec.network.get('serviceTopology', false) | bool | lower }});
      restore those inventory values. Changing them requires a new cluster.
