---
# Restarting one server is safe only while the others hold quorum, so every
# other control-plane node must be Ready and etcd healthy first. A single
# control plane has no others, so both checks skip.
- name: Require every other control-plane node Ready before upgrading {{ deploy_control_plane.name }}
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ deploy_state_dir }}/kubeconfig.yaml"
      - wait
      - --for=condition=Ready
      - "node/{{ item.name }}"
      - --timeout=2m
  loop: "{{ deployment_state.controlPlanes }}"
  loop_control:
    label: "{{ item.name }}"
  register: deploy_upgrade_nodes_ready
  changed_when: false
  retries: 10
  delay: 15
  until: deploy_upgrade_nodes_ready.rc == 0
  when: item.name != deploy_control_plane.name

- name: Require etcd to be ready on every other control plane before upgrading {{ deploy_control_plane.name }}
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - "{{ deploy_state_dir }}/ssh-config"
      - "inspace-cp{{ deploy_etcd_index }}"
      - >-
        sudo /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        --request-timeout=10s get --raw=/readyz/etcd
  loop: "{{ deployment_state.controlPlanes }}"
  loop_control:
    index_var: deploy_etcd_index
    label: "{{ item.name }}"
  register: deploy_upgrade_etcd_ready
  changed_when: false
  retries: 60
  delay: 5
  until: deploy_upgrade_etcd_ready.rc == 0
  when: item.name != deploy_control_plane.name

- name: Copy the fixed RKE2 binary upgrade installer to {{ deploy_control_plane.name }}
  ansible.builtin.command:
    argv:
      - scp
      - -F
      - "{{ deploy_state_dir }}/ssh-config"
      - "{{ deploy_root }}/templates/upgrade-rke2-server.sh"
      - "inspace-cp{{ deploy_cp_index }}:/tmp/inspace-upgrade-rke2-server.sh"
  changed_when: false

- name: Install RKE2 {{ rke2_version }} and restart only when changed on {{ deploy_control_plane.name }}
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - "{{ deploy_state_dir }}/ssh-config"
      - "inspace-cp{{ deploy_cp_index }}"
      - "sudo sh /tmp/inspace-upgrade-rke2-server.sh {{ rke2_version }}"
  register: deploy_control_plane_rke2_upgrade
  changed_when: deploy_control_plane_rke2_upgrade.stdout == 'changed'

- name: Wait for the upgraded local RKE2 API on {{ deploy_control_plane.name }}
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - "{{ deploy_state_dir }}/ssh-config"
      - "inspace-cp{{ deploy_cp_index }}"
      - >-
        sudo /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        --request-timeout=10s get --raw=/readyz
  register: deploy_local_rke2_upgrade_ready
  changed_when: false
  retries: 120
  delay: 5
  until: deploy_local_rke2_upgrade_ready.rc == 0

- name: Wait for {{ deploy_control_plane.name }} to become Ready after its RKE2 upgrade
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ deploy_state_dir }}/kubeconfig.yaml"
      - wait
      - --for=condition=Ready
      - "node/{{ deploy_control_plane.name }}"
      - --timeout=15m
  changed_when: false

- name: Require the exact upgraded kubelet version on {{ deploy_control_plane.name }}
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ deploy_state_dir }}/kubeconfig.yaml"
      - get
      - node
      - "{{ deploy_control_plane.name }}"
      - -o
      - jsonpath={.status.nodeInfo.kubeletVersion}
  register: deploy_control_plane_upgraded_version
  changed_when: false
  failed_when: deploy_control_plane_upgraded_version.stdout != deploy_expected_kubelet_version

- name: Require the private API to recover before upgrading the next server
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ deploy_state_dir }}/kubeconfig.yaml"
      - --request-timeout=10s
      - get
      - --raw=/readyz
  register: deploy_control_plane_api_upgrade_recovery
  changed_when: false
  retries: 60
  delay: 5
  until: deploy_control_plane_api_upgrade_recovery.rc == 0
