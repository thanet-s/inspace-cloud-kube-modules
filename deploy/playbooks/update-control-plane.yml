---
- name: Roll operator RKE2 configuration and upgrade cloud modules
  hosts: localhost
  gather_facts: false
  vars:
    deploy_create_state_dir: false
    # Only update may move the recorded RKE2 version, through the guarded
    # one-server-at-a-time upgrade in tasks/apply-rke2-upgrade.yml.
    deploy_allow_rke2_version_change: true
  tasks:
    - name: Validate inventory, topology, tools, and SSH identity
      ansible.builtin.include_tasks: tasks/preflight.yml

    - name: Require the API token for refreshing the in-cluster Secret
      ansible.builtin.assert:
        that: lookup('env', 'INSPACE_API_TOKEN') | length > 0
        fail_msg: "Export INSPACE_API_TOKEN; do not store it in inventory."
      no_log: true

    - name: Load and validate the deployment journal
      ansible.builtin.include_tasks: tasks/load-state.yml

    - name: Load immutable bootstrap output for chart and NodeClass rendering
      ansible.builtin.set_fact:
        bootstrap_result: "{{ lookup('file', deploy_state_dir + '/bootstrap-result.json') | from_json }}"

    # Resolve before any cluster change: the chart workloads run by the
    # digests recorded in the immutable GitHub release, never by a tag.
    - name: Resolve the immutable released module images
      ansible.builtin.command:
        argv:
          - python3
          - "{{ deploy_root }}/scripts/resolve_release_images.py"
          - "{{ modules_version }}"
      register: deploy_modules_release_images_result
      changed_when: false

    - name: Load the immutable module image digests
      ansible.builtin.set_fact:
        deploy_modules_release_images: >-
          {{ (deploy_modules_release_images_result.stdout | from_json).images }}

    - name: Start the private API tunnel and wait for readiness
      ansible.builtin.include_tasks: tasks/start-tunnel.yml

    # Cached nodes pull every RKE2 system image, chart image, and Karpenter
    # worker RKE2 archive from the bastion, which serves only what it holds.
    - name: Add this release's digest-pinned entries to the bastion bootstrap cache
      ansible.builtin.include_tasks: tasks/refresh-bootstrap-cache.yml
      when: not bootstrap_direct_download | bool

    - name: Upgrade the RKE2 binary one control-plane server at a time when requested
      ansible.builtin.include_tasks: tasks/apply-rke2-upgrade.yml

    - name: Apply operator RKE2 configuration with one-at-a-time restarts
      ansible.builtin.include_tasks: tasks/apply-control-plane-config.yml

    # An RKE2 upgrade can ship a new rke2-cilium chart whose cilium-config
    # changes without restarting every agent. Wait for the packaged chart Job,
    # then require each agent's drift checker to report zero pending keys.
    - name: Wait for the rke2-cilium chart install Job after control-plane changes
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG={{ (deploy_state_dir + '/kubeconfig.yaml') | quote }}
        job="$(kubectl -n kube-system get helmchart.helm.cattle.io rke2-cilium -o jsonpath='{.status.jobName}')"
        test -n "$job"
        kubectl -n kube-system wait --for=condition=complete "job/$job" --timeout=15m
        kubectl -n kube-system rollout status daemonset/cilium --timeout=15m
      args:
        executable: /bin/bash
      register: deploy_cilium_chart_settled
      changed_when: false
      retries: 3
      delay: 10
      until: deploy_cilium_chart_settled.rc == 0

    - name: Require every Cilium agent to run the current cilium-config
      ansible.builtin.command:
        argv:
          - "{{ deploy_root }}/scripts/verify-cilium-config-drift.sh"
      environment:
        KUBECONFIG: "{{ deploy_state_dir }}/kubeconfig.yaml"
      register: deploy_cilium_config_drift
      changed_when: false
      retries: 30
      delay: 10
      until: deploy_cilium_config_drift.rc == 0

    - name: Refresh the cloud API Secret
      ansible.builtin.shell: |
        set -euo pipefail
        # The API token reaches kubectl through a removed 0600 file, never
        # argv; printf is a shell builtin.
        umask 077
        secret_dir=$(mktemp -d)
        trap 'rm -rf -- "$secret_dir"' EXIT
        printf '%s' "$INSPACE_API_TOKEN" >"$secret_dir/api-token"
        kubectl --kubeconfig {{ (deploy_state_dir + '/kubeconfig.yaml') | quote }} \
          -n kube-system create secret generic inspace-cloud-credentials \
          --from-file="api-token=$secret_dir/api-token" \
          --from-literal="billing-account-id={{ inspace_billing_account_id }}" \
          --dry-run=client -o yaml | \
          kubectl --kubeconfig {{ (deploy_state_dir + '/kubeconfig.yaml') | quote }} apply -f -
      args:
        executable: /bin/bash
      environment:
        INSPACE_API_TOKEN: "{{ lookup('env', 'INSPACE_API_TOKEN') }}"
      changed_when: true
      no_log: true

    - name: Render updated chart values
      ansible.builtin.template:
        src: "{{ deploy_root }}/templates/chart-values.yaml.j2"
        dest: "{{ deploy_state_dir }}/chart-values.yaml"
        mode: "0600"

    - name: Upgrade the exact CRDs chart
      ansible.builtin.command:
        argv:
          - helm
          - --kubeconfig
          - "{{ deploy_state_dir }}/kubeconfig.yaml"
          - upgrade
          - --install
          - inspace-crds
          - oci://ghcr.io/thanet-s/charts/inspace-cloud-kube-modules-crds
          - --version
          - "{{ modules_version }}"
          - --namespace
          - kube-system
          - --wait
          - --timeout
          - 5m
      changed_when: true

    - name: Upgrade the exact CCM CSI and Karpenter chart
      ansible.builtin.command:
        argv:
          - helm
          - --kubeconfig
          - "{{ deploy_state_dir }}/kubeconfig.yaml"
          - upgrade
          - --install
          - inspace
          - oci://ghcr.io/thanet-s/charts/inspace-cloud-kube-modules
          - --version
          - "{{ modules_version }}"
          - --namespace
          - kube-system
          - --values
          - "{{ deploy_state_dir }}/chart-values.yaml"
          - --wait
          - --timeout
          - 15m
      changed_when: true

    # False leaves the NodeClass and NodePool to the operator's GitOps, which
    # must then move spec.rke2.version itself after an RKE2 upgrade.
    - name: Render the updated default Karpenter topology
      ansible.builtin.template:
        src: "{{ deploy_root }}/templates/karpenter.yaml.j2"
        dest: "{{ deploy_state_dir }}/karpenter.yaml"
        mode: "0600"
      when: karpenter_default_topology_enabled | default(true) | bool

    - name: Apply the updated default NodeClass and NodePool
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ deploy_state_dir }}/kubeconfig.yaml"
          - apply
          - -f
          - "{{ deploy_state_dir }}/karpenter.yaml"
      changed_when: true
      when: karpenter_default_topology_enabled | default(true) | bool

    - name: Persist active module version without changing bootstrap authority
      ansible.builtin.copy:
        content: >-
          {{ deployment_state |
             combine({'modulesVersion': modules_version}, recursive=true) |
             to_nice_json }}{{ '\n' }}
        dest: "{{ deploy_state_dir }}/state.json"
        mode: "0600"

    - name: Report the completed rolling update
      ansible.builtin.debug:
        msg: >-
          Cluster {{ cluster_name }} now runs cloud modules {{ modules_version }}.
          Bootstrap destroy authority remains pinned to
          {{ deployment_state.bootstrapControllerVersion }}.
