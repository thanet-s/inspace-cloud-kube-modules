---
all:
  hosts:
    localhost:
      ansible_connection: local

  vars:
    # The API token is deliberately not stored here. Export
    # INSPACE_API_TOKEN before running deploy/run.sh.
    inspace_api_url: https://api.inspace.cloud
    inspace_location: bkk01
    inspace_billing_account_id: 12345
    inspace_network_uuid: 11111111-1111-4111-8111-111111111111
    inspace_amd_host_pool_uuid: 22222222-2222-4222-8222-222222222222

    cluster_name: example-rke2
    # Exactly 1 (low cost) or 3 (embedded-etcd HA). Two is rejected.
    control_plane_replicas: 1
    control_plane_vip: 10.20.30.10
    private_load_balancer_pool_start: 10.20.30.200
    private_load_balancer_pool_stop: 10.20.30.239
    pod_cidr: 10.42.0.0/16
    service_cidr: 10.43.0.0/16

    # Use an exact published version. Published release candidates are also
    # supported for acceptance testing.
    # Ubuntu 26.04 needs modules_version 1.1.0-rc.3 or later.
    modules_version: 1.1.0-rc.4
    rke2_version: v1.36.5-rc2+rke2r1
    # Ubuntu release for control planes and Karpenter workers: "24.04" or
    # "26.04" (quoted). When omitted, an existing cluster keeps the release in
    # its persisted spec and a new cluster uses "26.04".
    os_version: "26.04"
    control_plane_vcpu: 2
    control_plane_memory_mib: 4096
    control_plane_root_disk_gib: 60
    # Applies to the bastion, fixed control planes, and generated Karpenter
    # NodeClass. True skips only apt-get upgrade and is intended for tests.
    skip_os_upgrade: false
    # True (the default) reboots the bastion and every control plane once, one
    # at a time, at the end of init when the first-boot OS upgrade ran, so the
    # new kernel takes effect. It does not affect Karpenter workers, which
    # reboot themselves once whenever their NodeClass runs the OS upgrade.
    # Re-running init on a cluster created by an older release reboots any host
    # that never rebooted since creation; set false to avoid that.
    post_upgrade_reboot: true
    # False uses the bastion cache for both fixed and Karpenter nodes.
    bootstrap_direct_download: false
    # Optional Cilium load-balancer settings, fixed at cluster creation.
    # Omit load_balancer_algorithm for Cilium's default (random) or set
    # "random" or "maglev". service_topology: true makes Cilium honor
    # Service trafficDistribution, including the Node-LB PreferSameNode default.
    # load_balancer_algorithm: maglev
    # service_topology: true
    # True enables Cilium Gateway API (pinned v1.6.1 standard CRDs, GatewayClass
    # "cilium"). It needs an rke2_version that bundles Cilium 1.20 or newer
    # (v1.34.12+, v1.35.9+, v1.36.5+, v1.37.0+) and is fixed at cluster creation.
    gateway_api_enabled: false
    # False also disables RKE2's rke2-traefik-crd chart so a Traefik you
    # install yourself with Helm owns its CRDs. Fixed at cluster creation;
    # gateway_api_enabled: true always disables it.
    rke2_traefik_crd_enabled: true

    ssh_username: inspace
    ssh_private_key_file: /home/example/.ssh/id_ed25519
    ssh_public_key_file: /home/example/.ssh/id_ed25519.pub
    # Any is the default. Prefer one public /32 when the operator has a stable
    # management address.
    management_cidr: 0.0.0.0/0

    # This file is merged by RKE2 after the bootstrap-owned base config.
    # Topology, identity, CNI, CIDR, token, and registry keys are rejected.
    control_plane_extra_config: {}

    # True annotates the chart's inspace-rwo StorageClass as the cluster
    # default, so PVCs without storageClassName use it. update can flip it.
    csi_storage_class_default: false

    # False makes init and update skip the default NodePool so GitOps can own
    # NodePools. The NodeClass below is always applied: Karpenter defaults to
    # it and CCM Node-LB copies it as the base of its load-balancer NodeClass.
    karpenter_default_node_pool_enabled: true
    karpenter_node_class_name: ubuntu-workers
    karpenter_node_pool_name: general
    karpenter_root_disk_gib: 100
    karpenter_cpu_limit: "128"
    karpenter_memory_limit: 256Gi
    karpenter_instance_families: [general, compute, memory, extra-memory]
    karpenter_min_cpu_exclusive: "1"
    karpenter_consolidate_after: 1m
    # Non-empty also applies an InSpaceNodeClass with firewallProfile
    # public-node-local for edge NodePools you create (CCM public-node-local
    # Services). One serves any number of pools. Clearing it later does not
    # delete it: kubectl apply never prunes.
    karpenter_public_node_local_node_class_name: ""
    karpenter_public_node_local_root_disk_gib: 30
